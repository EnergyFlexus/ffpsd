name: CI

# Lint and tests run side by side; the packages wait for both, and a tag such as v0.2.0 releases them.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".gitignore"] # a pull request is checked whatever it changes
  pull_request:

jobs:
  # The same checks as the pre-commit hooks: clang-format and the file names; rustfmt for the crates.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: cargo fmt --all -- --check

  # The Rust declarations of c_api.h, as bindgen of Ubuntu 24.04 writes them.
  bindings:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y bindgen clang rustfmt python3
      - run: python3 scripts/generate_rust_bindings.py --check

  # Debug with the tests, static and then shared.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # libpng, zlib-ng, libjpeg-turbo, libwebp and googletest under vendor/
          lfs: true # the PSD files the smoke tests read

      - name: Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Configures, builds and runs ctest; on Windows it sets up MSVC itself, as build.py does.
      - name: Static
        run: python scripts/run_tests.py
      - name: Shared
        run: python scripts/run_tests.py --shared

  # The crates with ffpsd built from source, as a build without a release archive does.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FFPSD_FROM_SOURCE: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Python package built from this checkout, its tests and the example.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest
      - run: python -m pytest bindings/python/tests
      - run: python examples/python/main.py tests/data/photoshop/rgb_levels.psd out.psd

  # Three archives per system: the shared library, the static one, and the apps alone.
  package:
    needs: [lint, test, bindings, rust, python]
    strategy:
      fail-fast: false
      matrix:
        # Named by the Rust target triple, so ffpsd-sys finds its archive by TARGET. The libraries of Windows are
        # built with the toolset of Visual Studio 2019, as a static library links only with one as new or newer.
        target:
          - { os: windows-latest, name: x86_64-pc-windows-msvc, flags: --msvc 14.29 }
          - { os: ubuntu-22.04, name: x86_64-unknown-linux-gnu } # the oldest runner, so older distributions run it too
          - { os: macos-latest, name: aarch64-apple-darwin, macos: "11.0" } # without it, the build runs only on the runner's macOS and newer
    runs-on: ${{ matrix.target.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # SDL3 opens its windows through X11 or Wayland, found when it runs; it needs their headers to build.
      - name: Ninja and the headers SDL3 builds against (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev libudev-dev

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Shared library
        shell: bash
        run: |
          python build.py --no-apps ${{ matrix.target.flags }}
          cp -R ffpsd-out "ffpsd-shared-$GITHUB_REF_NAME-${{ matrix.target.name }}"

      - name: Static library
        shell: bash
        run: |
          python build.py --static --no-apps ${{ matrix.target.flags }}
          cp -R ffpsd-out "ffpsd-static-$GITHUB_REF_NAME-${{ matrix.target.name }}"

      # /MT on Windows, so the apps need no Visual C++ runtime; clean, as the static library shares the build directory.
      - name: Apps
        shell: bash
        run: |
          python build.py --static --crt static --clean
          name="img2ffpsd-$GITHUB_REF_NAME-${{ matrix.target.name }}"
          mkdir "$name"
          cp ffpsd-out/bin/img2ffpsd* "$name"/
          cp -R ffpsd-out/share/ffpsd/licenses "$name"/licenses

      # tar keeps the executable bit and the symlinks of a .so or .dylib.
      - name: Archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir archives
          for name in ffpsd-shared-* ffpsd-static-* img2ffpsd-*; do
            if [ "$RUNNER_OS" = Windows ]; then
              7z a "archives/$name.zip" "$name" > /dev/null
            else
              tar -czf "archives/$name.tar.gz" "$name"
            fi
          done

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.target.name }}
          path: archives/
          retention-days: 1

  # The Python wheels of a release, each tested once built; pyproject.toml says which.
  wheels:
    needs: [lint, test, python]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true # the files the tests read
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "cibuildwheel>=3,<4"
      - run: python -P -m cibuildwheel --output-dir wheelhouse # -P, as for build below
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  # The source archive for the systems without a wheel, installed from itself to see that it holds enough.
  sdist:
    needs: [lint, test, python]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build pytest
      - run: python -P -m build --sdist # -P, or build.py at the root runs instead of the build package
      - run: python -m pip install dist/ffpsd-*.tar.gz
      - run: python -m pytest bindings/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          retention-days: 7

  # A tag pushed again starts its release over, keeping the tag, so old archives and notes do not stay behind.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and attach the archives
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # The tag must name the version in CMakeLists.txt, and the crates the same one.
      - name: Tag matches VERSION
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but CMakeLists.txt has VERSION $version"
            exit 1
          fi
          if ! grep -qxF "version = \"$version\"" Cargo.toml || ! grep -qF "ffpsd-sys = { version = \"$version\"" Cargo.toml; then
            echo "::error::the crates in Cargo.toml are not version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: archives
          merge-multiple: true

      # One line per archive, for sha256sum -c; ffpsd-sys carries its own copy of these hashes.
      - name: Checksums
        run: cd archives && sha256sum * > SHA256SUMS

      - name: Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" archives/* --title "$GITHUB_REF_NAME" --generate-notes --notes \
          "- \`ffpsd-shared-*\`: the shared library, its headers and CMake package.
          - \`ffpsd-static-*\`: the static library, its headers and CMake package.
          - \`img2ffpsd-*\`: the app, img2ffpsd-cli for the command line and img2ffpsd-ui with a window.
          - \`SHA256SUMS\`: their SHA-256, checked with \`sha256sum -c SHA256SUMS --ignore-missing\`.

          macOS builds are for Apple Silicon with macOS 11 or later, and unsigned: run \`xattr -d com.apple.quarantine\` on them once.

          Linux builds need glibc 2.34 and libstdc++ of GCC 11 or later, as in Ubuntu 22.04 and Debian 12."

  # Waits in the pypi environment for a maintainer's approval; PyPI trusts this workflow and environment, so no token.
  pypi:
    needs: [release, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the one-time token PyPI exchanges for an upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
